<VirtualHost 0.0.0.0:8080>
	ServerName codefree
	ProxyPreserveHost On

	ProxyPass /-  http://codefree:9000/-
	ProxyPassReverse /-  http://codefree:9000/-
	
	ProxyPass /  http://codefree_web:3000/
	ProxyPassReverse / http://codefree_web:3000/
</VirtualHost>

