<VirtualHost 0.0.0.0:8080>
	ServerName codefree
	ProxyPreserveHost On

	ProxyPass /api  http://codefree:9000/api
	ProxyPassReverse /api  http://codefree:9000/api
	
	ProxyPass /  http://codefree_web:3000/
	ProxyPassReverse / http://codefree_web:3000/
</VirtualHost>

